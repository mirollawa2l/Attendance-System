<script>
const $=s=>document.querySelector(s),V=$('#v'),on=v=>String(v).toUpperCase()==='TRUE';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(a,sel,ph)=>(ph?`<option value="">${ph}</option>`:'')+a.map(([v,l])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`).join('');
function qrCanvas(text){const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),scale=8,margin=4,c=document.createElement('canvas');c.width=c.height=(n+2*margin)*scale;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';for(let row=0;row<n;row++)for(let col=0;col<n;col++)if(q.isDark(row,col))x.fillRect((col+margin)*scale,(row+margin)*scale,scale,scale);return c;}
function qrCardCanvas(m){
 const c=document.createElement('canvas');c.width=900;c.height=1120;const x=c.getContext('2d');
 x.fillStyle='#f3f7f6';x.fillRect(0,0,c.width,c.height);
 x.fillStyle='#123b4a';x.fillRect(0,0,c.width,250);
 x.fillStyle='#e3aa54';x.beginPath();x.arc(790,70,155,0,Math.PI*2);x.fill();
 x.fillStyle='#fff';x.font='800 28px system-ui, sans-serif';x.textAlign='center';x.fillText('MORSHEDAT',450,75);
 x.font='700 36px system-ui, sans-serif';x.fillText('SON OF THUNDER',450,135);
 x.font='500 22px system-ui, sans-serif';x.fillStyle='#dcebe8';x.fillText('SCOUT MEMBER CARD',450,190);
 x.fillStyle='#fff';x.fillRect(70,290,760,735);
 x.fillStyle='#123b4a';x.font='800 44px system-ui, sans-serif';x.textAlign='center';
 const name=String(m.full_name||'Member');let line=name; if(x.measureText(line).width>690){x.font='800 36px system-ui, sans-serif';line=name;}
 x.fillText(line,450,365,690);
 x.fillStyle='#61757b';x.font='600 24px system-ui, sans-serif';x.fillText(String(m.unit||'Unit')+'  ·  '+String(m.troop||''),450,420);
 const qr=qrCanvas(m.qr_token);const qrSize=390;x.drawImage(qr,(900-qrSize)/2,455,qrSize,qrSize);
 x.fillStyle='#123b4a';x.font='800 46px ui-monospace, monospace';x.fillText(String(m.member_id||m.member_code||''),450,910);
 x.fillStyle='#61757b';x.font='500 20px system-ui, sans-serif';x.fillText('Keep this card for attendance scanning',450,965);
 x.fillStyle='#123b4a';x.fillRect(0,1060,900,60);x.fillStyle='#fff';x.font='600 20px system-ui, sans-serif';x.fillText('LEARN  ·  SERVE  ·  GROW',450,1098);
 return c;
}
function showMemberQrCard(m){const host=$('#qr');host.replaceChildren();const wrap=document.createElement('div');wrap.className='qr-card-preview';const canvas=qrCardCanvas(m);canvas.style.width='100%';wrap.appendChild(canvas);const actions=document.createElement('div');actions.className='qr-card-actions';const a=document.createElement('a');a.textContent='Download member QR card';a.download=(m.member_id||'member')+'-qr-card.png';a.href=canvas.toDataURL('image/png');a.style.cssText='display:inline-block;padding:10px 14px;border-radius:10px;background:#123b4a;color:white;text-decoration:none;font-weight:700';actions.appendChild(a);host.append(wrap,actions);host.scrollIntoView({behavior:'smooth',block:'nearest'});}

function call(fn,a){return new Promise((res,rej)=>google.script.run.withSuccessHandler(r=>r.ok?res(r.data):rej(r.error)).withFailureHandler(e=>rej({code:'NETWORK',message:'Network failure: '+(e&&e.message)})).api(fn,a||{}));}
let toastTimer;
function note(t,bad){const m=$('#msg');m.textContent=t||'';m.className=t?(bad?'bad':'success'):'';}
function toast(t,bad){const m=$('#toast');m.textContent=t;m.className='toast show'+(bad?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>m.className='toast',2600);}
function updateConnection(){const online=navigator.onLine;$('#connection-dot').className='connection-dot '+(online?'online':'offline');$('#connection-state').textContent=online?'Online':'Offline · scans are queued on this device';}
window.addEventListener('offline',updateConnection);updateConnection();
const SCANS_KEY='scouts-qr-offline-scans',ATTENDANCE_KEY='scouts-qr-offline-attendance';
const readQueue=k=>{try{const q=JSON.parse(localStorage.getItem(k)||'[]');if(!Array.isArray(q))throw Error('Invalid offline queue');return q;}catch(e){throw Error('Could not read offline data: '+e.message);}};
const writeQueue=(k,q)=>localStorage.setItem(k,JSON.stringify(q));
let S={act:'',acts:[],cfg:null},stream=null,scanTimer=null,busy=0,syncing=false,lastScanAt=0;const VIEWS={};
function queueScan(token,activity,scannedAt){const q=readQueue(SCANS_KEY);q.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),token,activity_id:activity,scanned_at:scannedAt});writeQueue(SCANS_KEY,q);}
function queueAttendance(payload){const q=readQueue(ATTENDANCE_KEY);q.push(payload);writeQueue(ATTENDANCE_KEY,q);}
async function syncOfflineData(){
 if(syncing||!navigator.onLine)return;syncing=true;let synced=0;
 try{
  let pending=readQueue(ATTENDANCE_KEY);
  while(pending.length){const item=pending[0];await call('submit',item.payload);pending.shift();writeQueue(ATTENDANCE_KEY,pending);
   if(item.scan_id){const ready=readQueue('scouts-qr-ready-scans').filter(x=>x.id!==item.scan_id);writeQueue('scouts-qr-ready-scans',ready);}synced++;}
  let scans=readQueue(SCANS_KEY),resolved=readQueue('scouts-qr-ready-scans');
  while(scans.length){const item=scans[0],d=await call('byToken',{token:item.token,activity_id:item.activity_id});
   resolved.push({...item,member:d.member,existing:d.existing});scans.shift();writeQueue('scouts-qr-ready-scans',resolved);writeQueue(SCANS_KEY,scans);synced++;}
  if(synced)note(synced+' offline item(s) synced. Review queued scans to complete attendance.');
  if($('#v')&&$('#v').querySelector('#reader'))showQueuedScans();
 }catch(e){note('Offline sync stopped: '+e.message,1);}
 finally{syncing=false;}
}
function showQueuedScans(){
 const host=$('#v'),q=readQueue('scouts-qr-ready-scans');if(!host)return;
 const old=host.querySelector('#queued-scans');if(old)old.remove();if(!q.length)return;
 const b=document.createElement('button');b.id='queued-scans';b.className='sec';b.textContent='Review saved scans ('+q.length+')';
 b.onclick=()=>{const item=readQueue('scouts-qr-ready-scans')[0];if(!item)return;S.act=item.activity_id;form(item.member,item.existing,item.id,item.scanned_at);};
 host.insertBefore(b,host.firstChild);
}
window.addEventListener('online',()=>{updateConnection();syncOfflineData();});
async function stopSc(){if(scanTimer){clearTimeout(scanTimer);scanTimer=null;}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 const video=$('#video');if(video){video.pause();video.srcObject=null;}}
async function startScanner(){if(stream)return;try{const video=$('#video');if(!video)return;
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Camera access requires HTTPS and a supported browser.');
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
 video.srcObject=stream;await video.play();const retry=$('#retry-camera');if(retry)retry.hidden=true;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
 const scan=()=>{if(!stream)return;if(Date.now()-lastScanAt<2600||busy){scanTimer=setTimeout(scan,100);return;}
  if(S.act&&video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);
   const frame=ctx.getImageData(0,0,canvas.width,canvas.height),result=jsQR(frame.data,frame.width,frame.height);
   if(result&&result.data){lastScanAt=Date.now();const shell=$('#camera-frame');shell.classList.add('scanned');setTimeout(()=>shell.classList.remove('scanned'),850);toast('QR code scanned');onScan(result.data);return;}}
  scanTimer=setTimeout(scan,120);};scan();}
 catch(e){await stopSc();const message=e.name==='NotAllowedError'?'Camera permission is blocked. Allow camera access in your browser settings, then tap Start camera.':e.name==='NotFoundError'?'No camera was found on this device. Use Scan from photo.':e.name==='NotReadableError'?'The camera is busy in another app. Close that app and retry.':e.message||'Camera unavailable. Use Scan from photo.';
  note(message,1);toast('Unable to open camera',true);const retry=$('#retry-camera');if(retry)retry.hidden=false;}}
async function readQrPhoto(file){
 if(!file||!file.type.startsWith('image/'))throw new Error('Choose an image file.');
 let image,url='',closeImage=()=>{};
 if(typeof createImageBitmap==='function'){
  image=await createImageBitmap(file);closeImage=()=>image.close();
 }else{
  url=URL.createObjectURL(file);
  try{image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Could not open this image.'));img.src=url;});}
  catch(e){URL.revokeObjectURL(url);throw e;}
  closeImage=()=>URL.revokeObjectURL(url);
 }
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
 if(!ctx){closeImage();throw new Error('Could not read the selected image.');}
 const scale=Math.min(1,2000/Math.max(image.width,image.height));
 canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
 try{ctx.drawImage(image,0,0,canvas.width,canvas.height);const frame=ctx.getImageData(0,0,canvas.width,canvas.height);
  return jsQR(frame.data,frame.width,frame.height);
 }finally{closeImage();canvas.width=canvas.height=0;}
}
async function go(n){await stopSc();busy=0;note('');$('#scan-tools').replaceChildren();try{await VIEWS[n]();}catch(e){note(e.message,1);}}
const needAct=async()=>{if(S.act)return true;await go('home');note('Select a meeting first',1);return false;};
VIEWS.home=async()=>go('scan');
async function roster(){let d;try{d=await call('eligible',{activity_id:S.act});localStorage.setItem('scouts-qr-roster-'+S.act,JSON.stringify(d));}
 catch(e){if(navigator.onLine&&e.code!=='NETWORK')throw e;const cached=localStorage.getItem('scouts-qr-roster-'+S.act);if(!cached)return;d=JSON.parse(cached);}
 const draw=()=>{const q=$('#q').value.toLowerCase();$('#res').innerHTML=d.filter(m=>[m.full_name,m.member_code,m.member_id,m.unit,m.troop].join(' ').toLowerCase().includes(q)).map(m=>`<div class=row data-i="${esc(m.member_id)}"><b dir=auto>${esc(m.full_name)}</b> <small>${esc(m.member_code||m.member_id)} · ${esc(m.unit||'')} · ${esc(m.troop||'')}</small><br><small dir=auto>${m.att?esc(m.att.attendance_status_label):'No record'}</small>${m.att?`<br><button type=button class=sec data-del-roster="${esc(m.att.attendance_id)}">Delete attendance</button>`:''}</div>`).join('');
 document.querySelectorAll('#res .row').forEach(r=>r.onclick=async()=>{const m=d.find(x=>x.member_id===r.dataset.i);await form(m,m.att);});
 document.querySelectorAll('[data-del-roster]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const m=d.find(x=>x.att&&x.att.attendance_id===b.dataset.delRoster);if(!m||!confirm('Delete attendance for '+m.full_name+'? Related automatic attendance points will also be removed.'))return;try{await call('deleteAttendance',{attendance_id:b.dataset.delRoster});await roster();note('Attendance record deleted.');}catch(err){note(err.message,1);}});};$('#q').oninput=draw;draw();}
VIEWS.scan=async()=>{const preferredMeeting=S.act||localStorage.getItem('scouts-qr-selected-activity')||'';S.act='';V.innerHTML='<div class=activity-picker><label for=sa>Meeting</label><select id=sa></select></div><section id=reader class=camera-card aria-label="QR code scanner"><div class=camera-frame id=camera-frame><video id=video playsinline muted autoplay aria-label="Live camera preview"></video><span class=scan-guide aria-hidden=true></span></div><p class=camera-caption>Center the student QR code in the frame.</p><div class=scan-options><button id=retry-camera type=button>Start camera</button><button id=choose-photo class=sec type=button>Scan from photo</button><input id=photo-file type=file accept="image/*" hidden aria-label="Choose a photo containing a student QR code"></div></section>';
 $('#scan-tools').innerHTML='<h3>Find a student manually</h3><input id=q placeholder="Search by name"><div id=res></div>';
 const cameraRequest=Promise.resolve();showQueuedScans();
 try{try{S.acts=await call('listActivities');localStorage.setItem('scouts-qr-activities',JSON.stringify(S.acts));}
  catch(e){const saved=localStorage.getItem('scouts-qr-activities');if(!saved)throw e;S.acts=JSON.parse(saved);}
  S.act=S.acts.some(a=>a.activity_id===preferredMeeting)?preferredMeeting:'';
  if(!S.act)localStorage.removeItem('scouts-qr-selected-activity');
  const select=$('#sa');select.innerHTML=opts(S.acts.map(a=>[a.activity_id,(a.activity_name||a.group_id+' Meeting')+' · '+(a.status||'open')]),S.act,'— Select meeting —');
  select.onchange=async e=>{S.act=e.target.value;if(S.act)localStorage.setItem('scouts-qr-selected-activity',S.act);else localStorage.removeItem('scouts-qr-selected-activity');if(!S.act){$('#res').replaceChildren();return;}try{await roster();note('Meeting selected. Scan a student QR code.');}catch(err){note(err.message,1);}};
  if(S.act&&S.acts.some(a=>a.activity_id===S.act)){select.value=S.act;try{await roster();}catch(e){note(e.message,1);}}
   else note('Select a meeting, then tap Start camera.');
 }catch(e){note('Could not load activities: '+e.message,1);}
 $('#retry-camera').onclick=()=>{startScanner();};
 $('#choose-photo').onclick=()=>$('#photo-file').click();
 $('#photo-file').onchange=async e=>{const input=e.currentTarget,file=input.files&&input.files[0];if(!file)return;
  if(!S.act){note('Select a meeting before scanning a photo.',1);input.value='';return;}
  if(busy){input.value='';return;}
  const activity=S.act;busy=1;
  try{const result=await readQrPhoto(file);if(S.act!==activity){note('Meeting changed. Choose the photo again for the selected activity.',1);}
   else if(!result||!result.data){note('No QR code found in that photo. Try a clearer, closer image.',1);toast('QR code not found',true);}
   else{note('QR code found in photo.');toast('QR code found in photo');busy=0;await onScan(result.data);}}
  catch(error){note(error.message||'Could not scan that photo.',1);toast('Unable to scan photo',true);}
  finally{busy=0;input.value='';}};
 await cameraRequest;};
async function onScan(t){if(busy)return;busy=1;await stopSc();const scannedAt=new Date().toISOString();
 if(!navigator.onLine){try{queueScan(t,S.act,scannedAt);showQueuedScans();note('Saved Offline. This scan will be checked when you reconnect.');await startScanner();}catch(e){note(e.message,1);}busy=0;return;}
 try{const d=await call('byToken',{token:t,activity_id:S.act});
 await form(d.member,d.existing,'',scannedAt);}
 catch(e){if(e.code==='NETWORK'){try{queueScan(t,S.act,scannedAt);showQueuedScans();note('Saved Offline. This scan will be checked when you reconnect.');await startScanner();}catch(x){note(x.message,1);}}
  else{await go('scan');note(e.code+': '+e.message,1);}}finally{busy=0;}}
async function form(m,ex,offlineScanId,scannedAt){await stopSc();$('#scan-tools').replaceChildren();const a=S.acts.find(x=>x.activity_id===S.act)||{};
 V.innerHTML=`<h3 dir=auto>${esc(m.full_name)}</h3><p>ID: ${esc(m.member_code||m.member_id)} · ${esc(m.unit||'')} · ${esc(m.troop||'')} · ${esc(m.group_name)}<br>${esc(m.unit||m.group_name||'Unit')} · ${esc(a.activity_date)}</p>${ex?'<p class=bad>Existing record – saving is a correction.</p>':''}
 <label>Attendance</label><select id=f1>${opts(S.cfg.att,ex&&ex.attendance_status_code,'— اختر —')}</select>
 <label>Uniform</label><select id=f2>${opts(S.cfg.uni.map(x=>[x,x]),ex&&ex.uniform_status,'— اختر —')}</select>
 ${[['f3','قداس','mass_participation'],['f4','مدارس أحد','sunday_school_participation'],['f5','اعتراف','confession_participation']].map(([i,l,k])=>`<label>${l}</label><select id=${i}>${opts(S.cfg.yn.map(x=>[x,x]),ex?ex[k]:S.cfg.yn[2])}</select>`).join('')}
 <label>Notes</label><textarea id=f6>${esc(ex&&ex.notes)}</textarea><br><button id=ok>Save attendance</button> <button id=cx class=sec>Cancel / Scan again</button>`;
 $('#cx').onclick=()=>go(ex?'review':'scan');
 $('#ok').onclick=async e=>{const b=e.target,v=i=>$('#'+i).value;if(!v('f1')||!v('f2'))return note('Attendance and uniform are required',1);b.disabled=true;
  const payload={member_id:m.member_id,activity_id:S.act,attendance_status_code:v('f1'),uniform_status:v('f2'),mass_participation:v('f3'),sunday_school_participation:v('f4'),confession_participation:v('f5'),notes:v('f6'),correction:!!ex,expected_updated_at:ex?ex.updated_at:'',scanned_at:scannedAt||new Date().toISOString()};
  if(!navigator.onLine){try{queueAttendance({payload,scan_id:offlineScanId||''});note('Saved Offline. Attendance will sync when you reconnect.');}catch(x){note(x.message,1);b.disabled=false;}return;}
  try{await call('submit',payload);if(offlineScanId){const q=readQueue('scouts-qr-ready-scans').filter(x=>x.id!==offlineScanId);writeQueue('scouts-qr-ready-scans',q);}
   await go(ex?'review':'scan');note('Saved: '+m.full_name);}
  catch(x){if(x.code==='NETWORK'){try{queueAttendance({payload,scan_id:offlineScanId||''});note('Saved Offline. Attendance will sync when you reconnect.');}catch(y){note(y.message,1);b.disabled=false;}}
   else{note(x.code+': '+x.message,1);b.disabled=false;}}};}
VIEWS.review=async()=>{

 $('#sa').onchange=e=>choose(e.target.value);

 $('#fin').onclick=()=>S.act&&fin('finalized');$('#cls').onclick=()=>S.act&&fin('closed');
 if(S.act){$('#sa').value=S.act;await roster();showQueuedScans();note('Meeting selected. Scan a member QR code or choose a name.');}else note('Select a meeting, then tap Start camera.');
};

 const loadTerm=async()=>{all=await call('allMemberAnalytics',{term:$('#analytics-term').value||'All'});drawAll();if($('#girl-pick').value)await renderOne();};
 const drawAll=()=>{const q=$('#analytics-q').value.trim().toLowerCase();const rows=all.filter(x=>[x.full_name,x.member_code,x.unit,x.troop,x.group_name].join(' ').toLowerCase().includes(q));
  $('#all-analytics').innerHTML=`<p>${rows.length} members</p><div class=table-wrap><table><thead><tr><th>Member name</th><th>ID</th><th>Unit</th><th>Troop</th><th>Attendance %</th><th>Points</th><th>Attended</th><th>Absences</th><th>Classification</th><th>Details</th></tr></thead><tbody>${rows.map(x=>`<tr><td dir=auto><b>${esc(x.full_name)}</b></td><td>${esc(x.member_code||x.member_id)}</td><td>${esc(x.unit||'—')}</td><td>${esc(x.troop||'—')}</td><td><b>${x.attendance_percent}%</b></td><td><b>${x.total_points}</b></td><td>${x.attended}/${x.total_meetings}</td><td>${x.absences}</td><td>${esc(x.class_name)}</td><td><button class=sec data-detail="${esc(x.member_id)}">View</button></td></tr>`).join('')||'<tr><td colspan=10>No results found.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{$('#girl-pick').value=b.dataset.detail;renderOne().catch(e=>note(e.message,1));$('#girl-report').scrollIntoView({behavior:'smooth',block:'start'});});
 };
 const renderOne=async()=>{const id=$('#girl-pick').value,host=$('#girl-report');if(!id){host.innerHTML='';return;}
  const a=await call('girlAnalytics',{member_id:id,term:$('#analytics-term').value||'All'}),m=a.member;
  const statusRows=Object.entries(a.status_counts).map(([label,count])=>`<tr><td dir=auto>${esc(label)}</td><td>${count}</td></tr>`).join('');
  const history=a.history.map(h=>`<tr><td>${esc(h.activity_date)}</td><td>${esc(h.attendance_status_label)}</td><td>${h.recorded?esc(h.uniform_status):'—'}</td><td>${h.recorded?esc(h.mass_participation):'—'}</td><td>${h.recorded?esc(h.sunday_school_participation):'—'}</td><td>${h.recorded?esc(h.confession_participation):'—'}</td></tr>`).join('');
  host.innerHTML=`<h4 dir=auto>${esc(m.full_name)} · ${esc(m.unit||'')} · ${esc(m.troop||'')}</h4><div class=row><b>Member details</b><p>ID: ${esc(m.member_code||m.member_id)} · Unit: ${esc(m.group_name||'—')} · Year: ${esc(m.year||'—')}</p><p>Birthday: ${esc(m.birthday_date||'—')} · Location: ${esc(m.location||'—')}</p><p>Phone: ${esc(m.phone_number||'—')} · National ID: ${esc(m.national_id||'—')}</p><p>Mother’s phone: ${esc(m.mother_phone||'—')} · Father’s phone: ${esc(m.father_phone||'—')}</p><p>Notes: ${esc(m.notes||'—')}</p></div>
  <div class=metrics><div class=metric><strong>${a.attendance_percent}%</strong><span>Attendance percentage</span></div><div class=metric><strong>${a.total_points}</strong><span>Total points</span></div><div class=metric><strong>${a.total_meetings}</strong><span>Total meetings</span></div><div class=metric><strong>${a.recorded_meetings}</strong><span>Meetings recorded</span></div><div class=metric><strong>${a.missing_records}</strong><span>Missing records</span></div><div class=metric><strong>${a.on_time}</strong><span>On time</span></div><div class=metric><strong>${a.late}</strong><span>Late</span></div><div class=metric><strong>${a.absences}</strong><span>Absences</span></div><div class=metric><strong>${a.uniform_compliance}</strong><span>Uniform compliance</span></div><div class=metric><strong>${a.class_name}</strong><span>Classification</span></div><div class=metric><strong>${a.watch_status}</strong><span>Follow-up status</span></div></div>
  <h4>Attendance status breakdown</h4><div class=table-wrap><table><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>${statusRows}</tbody></table></div>
  <h4>Meeting history</h4><div class=table-wrap><table><thead><tr><th>Date</th><th>Attendance</th><th>Uniform</th><th>قداس</th><th>مدارس أحد</th><th>اعتراف</th></tr></thead><tbody>${history||'<tr><td colspan=7>No meeting history yet.</td></tr>'}</tbody></table></div>
`;
 };
 $('#analytics-q').oninput=drawAll;$('#analytics-term').onchange=()=>loadTerm().catch(e=>note(e.message,1));$('#girl-pick').onchange=()=>renderOne().catch(e=>note(e.message,1));
 if(ms.length)$('#girl-pick').value=ms[0].member_id;await loadTerm();
};
call('init').then(c=>{S.cfg=c;$('#nav').innerHTML=[['review','Attendance'],['meetings','Meetings'],['records','Attendance Log'],['analytics','Analytics'],['members','Members'],['acts','Weekly Meetings']].map(([k,l])=>`<button class=sec data-g="${k}">${l}</button>`).join('');
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(b.dataset.g));syncOfflineData();go('review');}).catch(e=>{V.textContent=e.message;note(e.message,1);});
