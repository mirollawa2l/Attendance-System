<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scouts QR</title>
<style>body{font:16px system-ui;margin:0;padding:8px;max-width:640px;margin:auto}nav{display:flex;flex-wrap:wrap;gap:4px}button{padding:10px 12px;font-size:16px;border:0;border-radius:6px;background:#1a56db;color:#fff}button.sec{background:#666}button:disabled{opacity:.5}
select,input,textarea{width:100%;box-sizing:border-box;padding:10px;font-size:16px;margin:4px 0}input[type=checkbox]{width:auto}label{display:block;margin-top:8px;font-weight:600}.row{padding:10px;border-bottom:1px solid #ddd}#msg{padding:8px;margin:6px 0;border-radius:6px}.ok{background:#d1fae5}.bad{background:#fee2e2;color:#991b1b}#reader{width:100%}</style></head><body>
<nav id=nav></nav><div id=msg></div><div id=v>Loading…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s),V=$('#v'),on=v=>String(v).toUpperCase()==='TRUE';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(a,sel,ph)=>(ph?`<option value="">${ph}</option>`:'')+a.map(([v,l])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`).join('');
function call(fn,a){return new Promise((res,rej)=>google.script.run.withSuccessHandler(r=>r.ok?res(r.data):rej(r.error)).withFailureHandler(e=>rej({code:'NETWORK',message:'Network failure: '+(e&&e.message)})).api(fn,a||{}));}
function note(t,bad){const m=$('#msg');m.textContent=t||'';m.className=t?(bad?'bad':'ok'):'';}
let S={act:'',acts:[],cfg:null},sc=null,busy=0;const VIEWS={};
async function stopSc(){if(sc){try{await sc.stop();}catch(e){}sc=null;}}
async function go(n){await stopSc();note('');try{await VIEWS[n]();}catch(e){note(e.message,1);}}
const needAct=async()=>{if(S.act)return true;await go('home');note('Select an activity first',1);return false;};
VIEWS.home=async()=>{S.acts=await call('listActivities');V.innerHTML=`<h3>Activity</h3><select id=sa>${opts(S.acts.map(x=>[x.activity_id,x.activity_date+' · '+x.activity_name+' ['+x.status+']']),S.act,'— select —')}</select><p>${esc(S.cfg.email)} (${S.cfg.role})</p>`;$('#sa').onchange=e=>S.act=e.target.value;};
async function roster(){const d=await call('eligible',{activity_id:S.act});const draw=()=>{const q=$('#q').value.toLowerCase();$('#res').innerHTML=d.filter(m=>(m.full_name+m.member_id).toLowerCase().includes(q)).map(m=>`<div class=row data-i="${esc(m.member_id)}"><b dir=auto>${esc(m.full_name)}</b> <small>${esc(m.member_id)}</small><br><small dir=auto>${m.att?esc(m.att.attendance_status_label):'— no record —'}</small></div>`).join('');
 document.querySelectorAll('#res .row').forEach(r=>r.onclick=async()=>{const m=d.find(x=>x.member_id===r.dataset.i);if(m.att&&S.cfg.role!=='admin')return note('Already recorded; an admin must correct it.',1);await form(m,m.att);});};$('#q').oninput=draw;draw();}
VIEWS.scan=async()=>{if(!await needAct())return;V.innerHTML='<div id=reader></div><h4>Manual search</h4><input id=q placeholder="Name or ID"><div id=res></div>';await roster();
 try{sc=new Html5Qrcode('reader');await sc.start({facingMode:'environment'},{fps:10,qrbox:240},onScan,()=>{});}catch(e){sc=null;note('Camera denied or unavailable – use manual search. ('+(e.name||e)+')',1);}};
async function onScan(t){if(busy)return;busy=1;await stopSc();try{const d=await call('byToken',{token:t,activity_id:S.act});
 if(d.existing&&S.cfg.role!=='admin'){await go('scan');note('Already recorded: '+d.member.full_name,1);}else await form(d.member,d.existing);}
 catch(e){await go('scan');note(e.code+': '+e.message,1);}busy=0;}
async function form(m,ex){await stopSc();const a=S.acts.find(x=>x.activity_id===S.act)||{};
 V.innerHTML=`<h3 dir=auto>${esc(m.full_name)}</h3><p>${esc(m.member_id)} · ${esc(m.group_name)}<br>${esc(a.activity_name)} · ${esc(a.activity_date)}</p>${ex?'<p class=bad>Existing record – saving is a correction.</p>':''}
 <label>الحضور</label><select id=f1>${opts(S.cfg.att,ex&&ex.attendance_status_code,'— اختر —')}</select>
 <label>الزي</label><select id=f2>${opts(S.cfg.uni.map(x=>[x,x]),ex&&ex.uniform_status,'— اختر —')}</select>
 ${[['f3','قداس','mass_participation'],['f4','مدارس أحد','sunday_school_participation'],['f5','اعتراف','confession_participation']].map(([i,l,k])=>`<label>${l}</label><select id=${i}>${opts(S.cfg.yn.map(x=>[x,x]),ex?ex[k]:S.cfg.yn[2])}</select>`).join('')}
 <label>Notes</label><textarea id=f6>${esc(ex&&ex.notes)}</textarea><br><button id=ok>Submit</button> <button id=cx class=sec>Cancel / Rescan</button>`;
 $('#cx').onclick=()=>go(ex?'review':'scan');
 $('#ok').onclick=async e=>{const b=e.target,v=i=>$('#'+i).value;if(!v('f1')||!v('f2'))return note('Attendance and uniform are required',1);b.disabled=true;
  try{const r=await call('submit',{member_id:m.member_id,activity_id:S.act,attendance_status_code:v('f1'),uniform_status:v('f2'),mass_participation:v('f3'),sunday_school_participation:v('f4'),confession_participation:v('f5'),notes:v('f6'),correction:!!ex,expected_updated_at:ex?ex.updated_at:''});
   await go(ex?'review':'scan');note('Saved: '+m.full_name+' (points change: '+r.points_change+')');}catch(x){note(x.code+': '+x.message,1);b.disabled=false;}};}
VIEWS.review=async()=>{if(!await needAct())return;V.innerHTML='<input id=q placeholder="Name or ID"><div id=res></div><button id=fin>Finalize</button> <button id=cls class=sec>Close</button>';await roster();$('#fin').onclick=()=>fin('finalized');$('#cls').onclick=()=>fin('closed');};
async function fin(st,force){try{await call('finalize',{activity_id:S.act,status:st,force});note('Activity '+st);}catch(e){if(e.code==='MISSING_ATTENDANCE'&&confirm(e.message+'\nContinue anyway?'))return fin(st,true);note(e.message,1);}}
VIEWS.groups=async()=>{const g=await call('listGroups');V.innerHTML=g.map(x=>`<div class=row data-i="${esc(x.group_id)}" data-n="${esc(x.group_name)}" data-a="${on(x.active)}">${esc(x.group_name)} ${on(x.active)?'':'(inactive)'}</div>`).join('')+'<h4>Add / edit (tap a group to edit)</h4><input id=gn placeholder="Group name"><label><input type=checkbox id=ga checked> active</label><input type=hidden id=gi><button id=gs>Save</button>';
 document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{$('#gi').value=r.dataset.i;$('#gn').value=r.dataset.n;$('#ga').checked=r.dataset.a==='true';});
 $('#gs').onclick=async()=>{try{await call('saveGroup',{group_id:$('#gi').value,group_name:$('#gn').value,active:$('#ga').checked});await go('groups');note('Saved');}catch(e){note(e.message,1);}};};
VIEWS.members=async()=>{const [ms,gs]=await Promise.all([call('listMembers'),call('listGroups')]);
 V.innerHTML=`<input id=q placeholder="Search name or ID"><div id=res></div><div id=qr></div><h4>Add / edit</h4><input type=hidden id=mi><input id=mn placeholder="Full name"><select id=mg>${opts(gs.map(g=>[g.group_id,g.group_name]),'','— group —')}</select><input id=my placeholder="Year (optional)"><input id=mc placeholder="Contact (optional, admin only)"><label><input type=checkbox id=ma checked> active</label><button id=ms>Save</button>`;
 const draw=()=>{const q=$('#q').value.toLowerCase();$('#res').innerHTML=ms.filter(m=>(m.full_name+m.member_id).toLowerCase().includes(q)).map(m=>`<div class=row><b dir=auto>${esc(m.full_name)}</b> <small>${esc(m.member_id)} · ${esc(m.group_name)} · ${m.points} pts ${on(m.active)?'':'(inactive)'}</small><br>${S.cfg.role==='admin'?`<button class=sec data-e="${esc(m.member_id)}">Edit</button> <button class=sec data-q="${esc(m.member_id)}">QR</button>`:''}</div>`).join('');
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const m=ms.find(x=>x.member_id===b.dataset.e);$('#mi').value=m.member_id;$('#mn').value=m.full_name;$('#mg').value=m.group_id;$('#my').value=m.year;$('#mc').value=m.contact_info;$('#ma').checked=on(m.active);});
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const m=ms.find(x=>x.member_id===b.dataset.q),d=$('#qr');d.innerHTML='';new QRCode(d,{text:m.qr_token,width:220,height:220});setTimeout(()=>{const l=document.createElement('a');l.textContent='Download PNG ('+m.full_name+')';l.download=m.member_id+'.png';l.href=d.querySelector('canvas').toDataURL('image/png');d.append(document.createElement('br'),l);},60);});};
 $('#q').oninput=draw;draw();
 $('#ms').onclick=async()=>{try{await call('saveMember',{member_id:$('#mi').value,full_name:$('#mn').value,group_id:$('#mg').value,year:$('#my').value,contact_info:$('#mc').value,active:$('#ma').checked});await go('members');note('Saved');}catch(e){note(e.message,1);}};};
VIEWS.acts=async()=>{const [as,gs]=await Promise.all([call('listActivities'),call('listGroups')]);const gn={};gs.forEach(g=>gn[g.group_id]=g.group_name);
 V.innerHTML=as.map(a=>`<div class=row>${esc(a.activity_date)} · ${esc(a.activity_name)} <small>${esc(a.activity_type)} · ${a.group_id==='ALL'?'All groups':esc(gn[a.group_id])} · ${a.status}</small></div>`).join('')+`<h4>New activity</h4><input id=an placeholder="Name"><select id=at>${opts(['Weekly meeting','Scout activity','Church activity','Camp','Special event'].map(x=>[x,x]))}</select><input id=ad type=date><select id=ag>${opts([['ALL','All groups']].concat(gs.map(g=>[g.group_id,g.group_name])))}</select><button id=as>Create</button>`;
 $('#as').onclick=async()=>{try{await call('saveActivity',{activity_name:$('#an').value,activity_type:$('#at').value,activity_date:$('#ad').value,group_id:$('#ag').value});await go('acts');note('Created');}catch(e){note(e.message,1);}};};
VIEWS.points=async()=>{const [ms,as]=await Promise.all([call('listMembers'),call('listActivities')]);
 V.innerHTML=`<select id=pm>${opts(ms.map(m=>[m.member_id,m.full_name]),'','— member —')}</select><div id=pl></div><select id=pa>${opts(as.map(a=>[a.activity_id,a.activity_date+' '+a.activity_name]),'','(no activity)')}</select><input id=pd type=number step=1 placeholder="Points (integer, may be negative)"><input id=pr placeholder="Reason (required)"><button id=ps>Add</button>`;
 const load=async()=>{if(!$('#pm').value)return;const l=await call('ledger',{member_id:$('#pm').value});$('#pl').innerHTML=`<h3>Total: ${l.total}</h3>`+l.rows.map(t=>`<div class=row>${t.points_delta} · ${esc(t.source)} · <small>${esc(t.reason)} · ${esc(t.created_at)}</small></div>`).join('');};
 $('#pm').onchange=load;$('#ps').onclick=async()=>{try{await call('manualPoints',{member_id:$('#pm').value,activity_id:$('#pa').value,points:$('#pd').value,reason:$('#pr').value});note('Added');$('#pd').value=$('#pr').value='';load();}catch(e){note(e.message,1);}};};
VIEWS.ach=async()=>{const ms=await call('listMembers');V.innerHTML=`<select id=am>${opts(ms.map(m=>[m.member_id,m.full_name]),'','— member —')}</select><div id=al></div><input id=at placeholder="Title"><input id=ac placeholder="Description (optional)"><input id=ad type=date><input id=ab placeholder="Awarding servant (optional)"><button id=as>Record</button>`;
 const load=async()=>{if(!$('#am').value)return;const r=await call('listAchievements',{member_id:$('#am').value});$('#al').innerHTML=r.map(a=>`<div class=row>${esc(a.earned_at)} · <b>${esc(a.title)}</b> <small>${esc(a.description)}</small></div>`).join('');};
 $('#am').onchange=load;$('#as').onclick=async()=>{try{await call('addAchievement',{member_id:$('#am').value,title:$('#at').value,description:$('#ac').value,earned_at:$('#ad').value,awarded_by:$('#ab').value});note('Recorded');load();}catch(e){note(e.message,1);}};};
VIEWS.settings=async()=>{const r=await call('getRules');V.innerHTML='<h3>Attendance point rules</h3><p>Blank = unconfigured (submissions for that status are blocked).</p>'+r.rules.map(x=>`<div class=row dir=auto>${esc(x.label)}<input type=number step=1 data-c="${x.code}" value="${esc(x.points)}"></div>`).join('')+`<label><input type=checkbox id=aw ${r.allow?'checked':''}> Allow attendance without points (explicit mode)</label><button id=sv>Save</button>`;
 $('#sv').onclick=async()=>{const rules={};document.querySelectorAll('[data-c]').forEach(i=>rules[i.dataset.c]=i.value);try{await call('saveRules',{rules,allow:$('#aw').checked});note('Saved');}catch(e){note(e.message,1);}};};
call('init').then(c=>{S.cfg=c;$('#nav').innerHTML=[['home','Home'],['scan','Scan'],['review','Attendance'],['groups','Groups'],['members','Members'],['acts','Activities'],['points','Points'],['ach','Achievements'],['settings','Rules']].map(([k,l])=>`<button class=sec data-g="${k}">${l}</button>`).join('');
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(b.dataset.g));go('home');}).catch(e=>V.textContent=e.message);
</script></body></html>
