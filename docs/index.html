<style>

<script>
const $=s=>document.querySelector(s),V=$('#v'),on=v=>String(v).toUpperCase()==='TRUE';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(a,sel,ph)=>(ph?`<option value="">${ph}</option>`:'')+a.map(([v,l])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`).join('');
function safeFilePart(v){return String(v==null?'':v).normalize('NFC').replace(/[\u0000-\u001f\u007f]/g,'').replace(/\s+/g,'_').replace(/[^\p{L}\p{M}\p{N}_-]/gu,'').replace(/_+/g,'_').replace(/^[_-]+|[_-]+$/g,'');}
function qrFileName(m){const name=safeFilePart(m.full_name).slice(0,80)||'Member',code=safeFilePart(m.member_code||m.member_id)||'NoCode';return name+'_'+code+'.png';}
const CARD_FONT='"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif';
function drawQr(x,text,left,top,box){ // integer-sized modules keep edges crisp so the code scans reliably
 const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),quiet=4,cell=Math.max(1,Math.floor(box/(n+2*quiet))),size=cell*(n+2*quiet),ox=left+Math.floor((box-size)/2),oy=top+Math.floor((box-size)/2);
 x.fillStyle='#fff';x.fillRect(ox,oy,size,size);x.fillStyle='#000';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(ox+(c+quiet)*cell,oy+(r+quiet)*cell,cell,cell);}
function drawStar(x,cx,cy,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;x[i?'lineTo':'moveTo'](cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);}x.closePath();x.fill();}
function drawEmblem(x,cx,cy,r){ // original scouting-inspired mark: fleur-de-lis inside a ring (not an official logo)
 x.save();x.translate(cx,cy);x.fillStyle='#e3aa54';x.beginPath();x.arc(0,0,r,0,Math.PI*2);x.fill();
 x.strokeStyle='#fff';x.lineWidth=r*.05;x.beginPath();x.arc(0,0,r*.9,0,Math.PI*2);x.stroke();
 x.fillStyle='#123b4a';x.scale(r/100,r/100);x.translate(0,-4);
 x.beginPath();x.moveTo(0,-72);x.bezierCurveTo(26,-46,26,-8,0,12);x.bezierCurveTo(-26,-8,-26,-46,0,-72);x.fill();
 [1,-1].forEach(sx=>{x.save();x.scale(sx,1);x.beginPath();x.moveTo(-8,0);x.bezierCurveTo(-34,-54,-72,-28,-58,8);x.bezierCurveTo(-52,22,-30,24,-10,14);x.closePath();x.fill();x.restore();});
 x.fillRect(-34,16,68,12);
 x.beginPath();x.moveTo(-16,32);x.bezierCurveTo(-18,50,-8,56,0,66);x.bezierCurveTo(8,56,18,50,16,32);x.closePath();x.fill();
 x.fillStyle='#fff';drawStar(x,-62,-58,9);drawStar(x,62,-58,9);x.restore();}
const LOGO=new Image();LOGO.src=document.querySelector('.brand-logo').src; // same embedded logo as the page header
const logoReady=new Promise(r=>{LOGO.onload=()=>r(true);LOGO.onerror=()=>r(false);setTimeout(()=>r(false),2500);});
function qrCardCanvas(m){
 const W=1000,H=1380,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.textAlign='center';x.textBaseline='alphabetic';
 x.fillStyle='#fff';x.fillRect(0,0,W,H);
 // compact header: title on the left, small logo badge on the right
 x.fillStyle='#123b4a';x.fillRect(0,0,W,190);x.fillStyle='#e3aa54';x.fillRect(0,190,W,12);
 x.textAlign='left';x.direction='ltr';x.fillStyle='#fff';x.font='800 36px '+CARD_FONT;x.fillText('MORSHEDAT · SON OF THUNDER',56,92);
 x.font='600 22px '+CARD_FONT;x.fillStyle='#cfe3de';x.fillText('SCOUT MEMBER CARD',56,130);x.textAlign='center';
 if(LOGO.complete&&LOGO.naturalWidth){const lh=140,lw=Math.round(LOGO.naturalWidth*lh/LOGO.naturalHeight),bw=lw+28,bh=lh+20,bx=W-56-bw,by=Math.round((190-bh)/2);
  x.fillStyle='#fff';x.beginPath();x.moveTo(bx+16,by);x.arcTo(bx+bw,by,bx+bw,by+bh,16);x.arcTo(bx+bw,by+bh,bx,by+bh,16);x.arcTo(bx,by+bh,bx,by,16);x.arcTo(bx,by,bx+bw,by,16);x.closePath();x.fill();
  x.drawImage(LOGO,bx+14,by+10,lw,lh);}
 else drawEmblem(x,W-56-62,95,62);
 const name=String(m.full_name||'Member');let size=68;x.fillStyle='#123b4a';x.direction=/[\u0600-\u06FF]/.test(name)?'rtl':'ltr';
 do{x.font='800 '+size+'px '+CARD_FONT;size-=2;}while(x.measureText(name).width>860&&size>30);
 x.fillText(name,W/2,304);
 x.direction='ltr';x.fillStyle='#4f656b';x.font='600 34px '+CARD_FONT;
 const sub=[m.unit,m.troop].filter(Boolean).join('  ·  ');if(sub)x.fillText(sub,W/2,360);
 x.strokeStyle='#dbe6e3';x.lineWidth=4;x.fillStyle='#fff';x.beginPath();x.rect(110,402,780,780);x.fill();x.stroke();
 drawQr(x,String(m.qr_token||''),130,422,740);
 x.fillStyle='#61757b';x.font='700 24px '+CARD_FONT;x.fillText('MEMBER CODE',W/2,1238);
 x.fillStyle='#123b4a';x.font='800 78px ui-monospace,Consolas,monospace';x.fillText(String(m.member_code||m.member_id||''),W/2,1316);
 x.fillStyle='#e3aa54';x.fillRect(0,1344,W,6);x.fillStyle='#123b4a';x.fillRect(0,1350,W,30);
 return c;}
let qrCardSeq=0;
async function showMemberQrCard(m){const host=$('#qr'),seq=++qrCardSeq;host.replaceChildren();await logoReady;if(seq!==qrCardSeq)return; // old card cleared first; if tapped again meanwhile, only the newest tap draws
 const wrap=document.createElement('div');wrap.className='qr-card-preview';const canvas=qrCardCanvas(m);wrap.appendChild(canvas);
 const actions=document.createElement('div');actions.className='qr-card-actions';
 const a=document.createElement('a');a.className='qr-download';a.textContent='Download member QR card';a.download=qrFileName(m);a.href=canvas.toDataURL('image/png');
 const pr=document.createElement('button');pr.type='button';pr.className='sec qr-print';pr.textContent='Print';pr.onclick=()=>window.print();
 actions.append(a,pr);host.append(actions,wrap);host.scrollIntoView({behavior:'smooth',block:'nearest'});}
window.addEventListener('beforeprint',()=>{const h=$('#qr');if(h&&h.querySelector('.qr-card-preview'))document.body.classList.add('printing-qr');});
window.addEventListener('afterprint',()=>document.body.classList.remove('printing-qr'));
function call(fn,a){return ScoutsApi.call(fn,a||{}).catch(e=>{if(e&&e.code==='UNAUTHORIZED'){ScoutsApi.setKey('');showGate('The access code was not accepted. Enter it again.');}throw e;});}
// ---------- Access-code gate (the backend is public, so every request must carry the code) ----------
function showGate(msg){let g=$('#gate');if(!g){g=document.createElement('div');g.id='gate';g.innerHTML='<div class=gate-box><h2>Enter access code</h2><p>Ask your leader for the code. It is saved on this device only.</p><input id=gate-code type=password autocomplete=current-password placeholder="Access code" aria-label="Access code"><p id=gate-msg class=bad role=alert style="color:var(--danger)"></p><button id=gate-go type=button>Continue</button></div>';document.body.appendChild(g);
  const go=async()=>{const code=$('#gate-code').value.trim();if(!code){$('#gate-msg').textContent='Enter the access code.';return;}const b=$('#gate-go');b.disabled=true;$('#gate-msg').textContent='';ScoutsApi.setKey(code);
   try{await ScoutsApi.call('init');g.hidden=true;$('#gate-code').value='';boot();}catch(e){if(e.code==='UNAUTHORIZED')ScoutsApi.setKey('');$('#gate-msg').textContent=e.message;}finally{b.disabled=false;}};
  $('#gate-go').onclick=go;$('#gate-code').onkeydown=e=>{if(e.key==='Enter')go();};}
 g.hidden=false;$('#gate-msg').textContent=msg||'';setTimeout(()=>{try{$('#gate-code').focus();}catch(_){}},50);}
let toastTimer;
function note(t,bad){const m=$('#msg');m.textContent=t||'';m.className=t?(bad?'bad':'success'):'';}

  let scans=readQueue(SCANS_KEY),resolved=readQueue('scouts-qr-ready-scans');

  const r=await call('meetingReport',{activity_id:id});
  const attended=r.rows.filter(x=>x.attendance&&ATTENDED.includes(x.attendance.attendance_status_code)).length;const attendancePct=r.eligible_count?Math.round(attended/r.eligible_count*100):0;const rows=r.rows.map(x=>{const a=x.attendance;return `<tr><td dir=auto><b>${esc(x.member_name)}</b><br><small>${esc(x.group_name)}</small></td><td>${a?esc(a.attendance_status_label):'Not recorded'}</td><td>${a?esc(a.uniform_status):'—'}</td><td>${a?esc(a.mass_participation):'—'}</td><td>${a?esc(a.sunday_school_participation):'—'}</td><td>${a?esc(a.confession_participation):'—'}</td><td dir=auto>${a?esc(a.notes||''):''}</td><td>${a?`<button class=sec data-md-del="${esc(a.attendance_id)}" data-name="${esc(x.member_name)}">Delete</button>`:''}</td></tr>`;}).join('');
  host.innerHTML=`<h4>${esc(r.activity.activity_name||r.activity.activity_date)}</h4><div class=metrics><div class=metric><strong>${attendancePct}%</strong><span>Attendance rate for this meeting</span></div><div class=metric><strong>${r.eligible_count}</strong><span>Eligible members</span></div><div class=metric><strong>${r.recorded_count}</strong><span>Attendance records</span></div><div class=metric><strong>${r.missing_count}</strong><span>Not recorded yet</span></div></div><div class=table-wrap><table><thead><tr><th>Member name / Unit</th><th>Attendance</th><th>Uniform</th><th>قداس</th><th>مدارس احد</th><th>اعتراف</th><th>Notes</th><th>Action</th></tr></thead><tbody>${rows||'<tr><td colspan=8>No eligible members found for this meeting.</td></tr>'}</tbody></table></div><button class=sec id=md-del-meeting>Delete this meeting</button>`;
  host.querySelectorAll('[data-md-del]').forEach(b=>b.onclick=()=>removeRecord('attendance',b.dataset.mdDel,'Delete attendance for '+b.dataset.name+'? Related automatic attendance points will also be removed.','Attendance record deleted.',render));
  $('#md-del-meeting').onclick=()=>removeRecord('activity',id,'Delete '+(r.activity.activity_name||'this meeting')+' and all its attendance/points records? This cannot be undone.','Meeting and related records deleted.',()=>go('meetings'));
 };
 $('#meeting-pick').onchange=()=>render().catch(e=>note(e.message,1));
 if(acts.length){$('#meeting-pick').value=acts[0].activity_id;await render();}
};
VIEWS.records=async()=>{
 const [records,acts]=await Promise.all([call('listAttendance'),call('listActivities')]);
 V.innerHTML=`<h3>Attendance Log</h3><input id=record-q placeholder="ابحثي بMember name أو الاجتماع أو Unit"><select id=record-act>${opts(acts.map(a=>[a.activity_id,(a.activity_name||a.group_id+' Meeting')+' · '+(a.term||'Legacy')]),'','All meetings')}</select><div id=record-results></div>`;
 const draw=()=>{const q=$('#record-q').value.trim().toLowerCase(),act=$('#record-act').value;
  const list=records.filter(r=>(!act||r.activity_id===act)&&[r.member_name,r.group_name,r.attendance_status_label,r.activity_date].join(' ').toLowerCase().includes(q));
  $('#record-results').innerHTML=`<p>${list.length} records</p><div class=table-wrap><table><thead><tr><th>Date</th><th>Member name</th><th>Unit</th><th>Attendance</th><th>Uniform</th><th>قداس</th><th>مدارس احد</th><th>اعتراف</th><th>Notes</th><th>Action</th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.activity_date)}</td><td dir=auto><b>${esc(r.member_name)}</b></td><td>${esc(r.group_name)}</td><td>${esc(r.attendance_status_label)}</td><td>${esc(r.uniform_status)}</td><td>${esc(r.mass_participation)}</td><td>${esc(r.sunday_school_participation)}</td><td>${esc(r.confession_participation)}</td><td dir=auto>${esc(r.notes||'')}</td><td><button class=sec data-del-attendance="${esc(r.attendance_id)}">Delete</button></td></tr>`).join('')||'<tr><td colspan=10>No matching records.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('[data-del-attendance]').forEach(b=>b.onclick=()=>{const r=list.find(x=>x.attendance_id===b.dataset.delAttendance);if(r)removeRecord('attendance',r.attendance_id,`Delete attendance for ${r.member_name} on ${r.activity_date}? Related automatic attendance points will also be removed.`,'Attendance record deleted.',()=>go('records'));});
 };
 $('#record-q').oninput=draw;$('#record-act').onchange=draw;draw();
};
VIEWS.analytics=async()=>{
 const ms=await call('listMembers');let all=[];
 const currentYear=new Date().getFullYear();
 const years=[...new Set([...(S.cfg.terms||[]).map(t=>String(t).slice(-4)),...Array.from({length:7},(_,i)=>String(currentYear+2-i))])].filter(y=>/^\d{4}$/.test(y)).sort().reverse();
 const termFilter=()=>{const t=$('#analytics-season').value,y=$('#analytics-year').value;return t!=='All'&&y!=='All'?t+' '+y:t!=='All'?t:y!=='All'?y:'All';};
V.innerHTML=`<h3>Member Analytics</h3>
<p>Filter attendance and analytics by season and year. Points remain cumulative for the whole year.</p>
<label for=analytics-season>Season</label>
<select id=analytics-season>${opts([['All','All seasons'],['Spring','Spring'],['Fall','Fall'],['Summer','Summer']],'All')}</select>
<label for=analytics-year>Year</label>
<select id=analytics-year>${opts([['All','All years'],...years.map(y=>[y,y])],'All')}</select>
<input id=analytics-q placeholder="ابحثي بالاسم أو Unit أو Troop">
<div id=all-analytics></div>
<hr>
<label for=girl-pick>Select a member</label>
<select id=girl-pick>${opts(ms.map(m=>[m.member_id,m.full_name+' · '+(m.unit||m.group_name||'')+' · '+(m.troop||'')]),'','— Select member —')}</select>
<div id=girl-report></div>`;
const refreshMemberPicker=()=>{
  const old=$('#girl-pick').value;
  $('#girl-pick').innerHTML=opts(
    ms.map(m=>[
      m.member_id,
      m.full_name+' · '+(m.unit||m.group_name||'')+' · '+(m.troop||'')
    ]),
    ms.some(m=>m.member_id===old)?old:'',
    '— Select member —'
  );
};
 const loadTerm=async()=>{all=await call('allMemberAnalytics',{term:termFilter()});refreshMemberPicker();drawAll();if($('#girl-pick').value)await renderOne();else $('#girl-report').innerHTML='';};
 const drawAll=()=>{const q=$('#analytics-q').value.trim().toLowerCase();
const rows=all.filter(x=>
  [x.full_name,x.member_code,x.unit,x.troop,x.group_name]
    .join(' ').toLowerCase().includes(q)
);
  $('#all-analytics').innerHTML=`<p>${rows.length} members</p><div class=table-wrap><table><thead><tr><th>Member name</th><th>ID</th><th>Unit</th><th>Troop</th><th>Attendance %</th><th>Points</th><th>Attended</th><th>Absences</th><th>Classification</th><th>Details</th></tr></thead><tbody>${rows.map(x=>`<tr><td dir=auto><b>${esc(x.full_name)}</b></td><td>${esc(x.member_code||x.member_id)}</td><td>${esc(x.unit||'—')}</td><td>${esc(x.troop||'—')}</td><td><b>${x.attendance_percent}%</b></td><td><b>${x.total_points}</b></td><td>${x.attended}/${x.total_meetings}</td><td>${x.absences}</td><td>${esc(x.class_name)}</td><td><button class=sec data-detail="${esc(x.member_id)}">View</button> <button class=sec data-an-del-member="${esc(x.member_id)}" data-name="${esc(x.full_name)}">Delete</button></td></tr>`).join('')||'<tr><td colspan=10>No results found.</td></tr>'}</tbody></table></div>`;
  document.querySelectorAll('[data-an-del-member]').forEach(b=>b.onclick=()=>removeRecord('member',b.dataset.anDelMember,'Delete '+b.dataset.name+' and all of her attendance/points history? This cannot be undone.','Member and related history deleted.',()=>go('analytics')));
  document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{$('#girl-pick').value=b.dataset.detail;renderOne().catch(e=>note(e.message,1));$('#girl-report').scrollIntoView({behavior:'smooth',block:'start'});});
 };
 const renderOne=async()=>{const id=$('#girl-pick').value,host=$('#girl-report');if(!id){host.innerHTML='';return;}
  const a=await call('girlAnalytics',{member_id:id,term:termFilter()}),m=a.member;
  const statusRows=Object.entries(a.status_counts).map(([label,count])=>`<tr><td dir=auto>${esc(label)}</td><td>${count}</td></tr>`).join('');
  const history=a.history.map(h=>`<tr><td>${esc(h.activity_date)}</td><td>${esc(h.attendance_status_label)}</td><td>${h.recorded?esc(h.uniform_status):'—'}</td><td>${h.recorded?esc(h.mass_participation):'—'}</td><td>${h.recorded?esc(h.sunday_school_participation):'—'}</td><td>${h.recorded?esc(h.confession_participation):'—'}</td><td>${h.recorded&&h.attendance_id?`<button class=sec data-hist-del="${esc(h.attendance_id)}" data-date="${esc(h.activity_date)}">Delete</button>`:''}</td></tr>`).join('');
  host.innerHTML=`<h4 dir=auto>${esc(m.full_name)} · ${esc(m.unit||'')} · ${esc(m.troop||'')}</h4><div class=row><b>Member details</b><p>ID: ${esc(m.member_code||m.member_id)} · Unit: ${esc(m.group_name||'—')} · Year: ${esc(m.year||'—')}</p><p>Birthday: ${esc(m.birthday_date||'—')} · Location: ${esc(m.location||'—')}</p><p>Phone: ${esc(m.phone_number||'—')} · National ID: ${esc(m.national_id||'—')}</p><p>Mother’s phone: ${esc(m.mother_phone||'—')} · Father’s phone: ${esc(m.father_phone||'—')}</p><p>Notes: ${esc(m.notes||'—')}</p><button class=sec id=an-del-one>Delete member</button></div>
  <div class=metrics><div class=metric><strong>${a.attendance_percent}%</strong><span>Attendance percentage</span></div><div class=metric><strong>${a.total_points}</strong><span>Total points</span></div><div class=metric><strong>${a.total_meetings}</strong><span>Total meetings</span></div><div class=metric><strong>${a.recorded_meetings}</strong><span>Meetings recorded</span></div><div class=metric><strong>${a.missing_records}</strong><span>Missing records</span></div><div class=metric><strong>${a.attended}</strong><span>Attended</span></div><div class=metric><strong>${a.on_time}</strong><span>On time</span></div><div class=metric><strong>${a.late}</strong><span>Late</span></div><div class=metric><strong>${a.absences}</strong><span>Absences</span></div><div class=metric><strong>${a.uniform_compliance}</strong><span>Uniform compliance</span></div><div class=metric><strong>${a.class_name}</strong><span>Classification</span></div><div class=metric><strong>${a.watch_status}</strong><span>Follow-up status</span></div></div>
  <h4>Attendance status breakdown</h4><div class=table-wrap><table><thead><tr><th>Status</th><th>Count</th></tr></thead><tbody>${statusRows}</tbody></table></div>
  <h4>Meeting history</h4><div class=table-wrap><table><thead><tr><th>Date</th><th>Attendance</th><th>Uniform</th><th>قداس</th><th>مدارس احد</th><th>اعتراف</th><th>Action</th></tr></thead><tbody>${history||'<tr><td colspan=7>No meeting history yet.</td></tr>'}</tbody></table></div>
`;
  $('#an-del-one').onclick=()=>removeRecord('member',m.member_id,'Delete '+m.full_name+' and all of her attendance/points history? This cannot be undone.','Member and related history deleted.',()=>go('analytics'));
  host.querySelectorAll('[data-hist-del]').forEach(b=>b.onclick=()=>removeRecord('attendance',b.dataset.histDel,'Delete attendance for '+m.full_name+' on '+b.dataset.date+'? Related automatic attendance points will also be removed.','Attendance record deleted.',loadTerm));
 };
 $('#analytics-q').oninput=drawAll;$('#analytics-season').onchange=$('#analytics-year').onchange=()=>loadTerm().catch(e=>note(e.message,1));$('#girl-pick').onchange=()=>renderOne().catch(e=>note(e.message,1));
 await loadTerm();
};
function boot(){call('init').then(c=>{S.cfg=c;$('#nav').innerHTML=[['review','Attendance'],['meetings','Meetings'],['records','Attendance Log'],['analytics','Analytics'],['members','Members'],['acts','Weekly Meetings']].map(([k,l])=>`<button class=sec data-g="${k}">${l}</button>`).join('');
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go(b.dataset.g));syncOfflineData();go('review');}).catch(e=>{V.textContent=e.message;note(e.message,1);});}
$('#lock-btn').onclick=()=>{try{stopSc();}catch(_){}ScoutsApi.setKey('');location.reload();};
if(ScoutsApi.getKey())boot();else showGate('');
</script></body></html>
